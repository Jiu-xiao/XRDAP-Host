[package]
name = "xrdap"
description = "XR-DAP 探针的上位机库：传输、CMSIS-DAP 初始化、厂商扩展命令、DWARF 变量解析"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["usb", "elf", "discover"]
# CMSIS-DAP v2 USB Bulk 传输
usb = ["dep:nusb"]
# 读 ELF 符号和 DWARF 类型
elf = ["dep:object", "dep:gimli"]
# 找探针：串口挨个问 DAP_Info（按 USB VID 挑候选口），局域网用 mDNS
discover = ["usb", "dep:mdns-sd"]
# 进程内的模拟探针，测试和演示用
fake = []

[dependencies]
nusb = { version = "0.2", optional = true }
object = { version = "0.40", optional = true, default-features = false, features = ["read_core", "elf", "std"] }
gimli = { version = "0.34", optional = true, default-features = false, features = ["read", "std"] }
serialport = "4.10"
mdns-sd = { version = "0.21.6", optional = true }

[[test]]
name = "fake_probe"
required-features = ["fake", "elf"]
