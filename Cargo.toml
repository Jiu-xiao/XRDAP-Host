[workspace]
resolver = "2"
members = ["xrdap", "xrdap-tool", "xrdap-sim"]

[workspace.package]
version = "0.5.2"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
xrdap = { path = "xrdap", default-features = false }
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
