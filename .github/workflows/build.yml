name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: .exe
            suffix: windows-x86_64.exe
          - os: ubuntu-latest
            exe: ''
            suffix: linux-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装图形界面依赖（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev

      - name: 测试
        run: cargo test --release --workspace

      - name: 编译
        run: cargo build --release --workspace

      - name: 整理可执行文件
        run: |
          mkdir dist
          cp target/release/xrdap${{ matrix.exe }} dist/xrdap-${{ matrix.suffix }}
          cp target/release/xrdap-forward${{ matrix.exe }} dist/xrdap-forward-${{ matrix.suffix }}
          cp target/release/xrdap-gui${{ matrix.exe }} dist/xrdap-gui-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: xrdap-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 整理发布文件
        run: |
          mkdir release
          cp artifacts/* release/
          chmod +x release/*linux-x86_64
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: 发布 release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
