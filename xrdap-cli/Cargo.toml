[package]
name = "xrdap-cli"
description = "XR-DAP 探针的命令行工具 xrdap：读写目标变量、在探针上周期采样"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "xrdap_cli"
path = "src/lib.rs"

[[bin]]
name = "xrdap"
path = "src/main.rs"

[dependencies]
xrdap = { path = "../xrdap" }
clap = { workspace = true }
ctrlc = "3.4"
